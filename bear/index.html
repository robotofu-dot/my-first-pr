<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}</style><title>大熊娃娃配音試聽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a prompt-book — sticky transport bar on top, then the script as numbered cue rows grouped by act */
:root{
  --bg:#f3f5f1; --paper:#ffffff; --ink:#1d2a24; --muted:#5f6e66; --line:#d9e0da;
  --pine:#1f5a45; --pine-soft:#e2eee8; --berry:#b2333a; --berry-soft:#f8e3e3; --gold:#a8741a; --gold-soft:#f8eed8;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r-xiaogai:#c0572a; --r-jisu:#1f5a45; --r-xiaoma:#2d64a8; --r-xiaoya:#a33f7c; --r-xiaofu:#7a5bb0; --r-class:#6b7a3a; --r-narr:#5b5248;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111915; --paper:#18221d; --ink:#e6ece8; --muted:#97a69e; --line:#2b3832;
  --pine:#6cc3a0; --pine-soft:#1d332a; --berry:#f0868b; --berry-soft:#3a2023; --gold:#e3b862; --gold-soft:#352a16;
  --r-xiaogai:#f0915f; --r-jisu:#6cc3a0; --r-xiaoma:#7fb1f0; --r-xiaoya:#e48cc0; --r-xiaofu:#b9a0ea; --r-class:#b6c779; --r-narr:#c4b9ab; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111915; --paper:#18221d; --ink:#e6ece8; --muted:#97a69e; --line:#2b3832;
  --pine:#6cc3a0; --pine-soft:#1d332a; --berry:#f0868b; --berry-soft:#3a2023; --gold:#e3b862; --gold-soft:#352a16;
  --r-xiaogai:#f0915f; --r-jisu:#6cc3a0; --r-xiaoma:#7fb1f0; --r-xiaoya:#e48cc0; --r-xiaofu:#b9a0ea; --r-class:#b6c779; --r-narr:#c4b9ab; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 18px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,38px);line-height:1.2;margin:4px 0 10px;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:14px}
.stats b{font-variant-numeric:tabular-nums}
.ok{color:var(--pine)} .warn{color:var(--gold)} .bad{color:var(--berry)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-block:1px solid var(--line)}
.bar .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.now{display:flex;align-items:center;gap:10px;min-width:0}
.now .meta{min-width:0;flex:1}
.now .who{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .what{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px;cursor:pointer}
.prog i{display:block;height:100%;width:0;background:var(--pine)}
button{font:inherit;color:inherit;cursor:pointer}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px}
.btn:hover{border-color:var(--pine)}
.btn.on{background:var(--pine);border-color:var(--pine);color:var(--paper)}
.btn:focus-visible,.take:focus-visible,.play:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.big{width:40px;height:40px;border-radius:50%;border:0;background:var(--pine);color:var(--paper);display:grid;place-items:center;flex:none}
.big svg{width:16px;height:16px;fill:currentColor}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.act{padding-block:26px 6px}
.act h2{font-family:var(--display);font-weight:900;font-size:22px;margin:0;display:flex;align-items:baseline;gap:10px}
.act h2 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
.cue{display:grid;grid-template-columns:52px 1fr;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cue:last-child{border-bottom:0}
.cue.playing{background:linear-gradient(90deg,var(--pine-soft),transparent 70%)}
.num{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.body{min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.role{font-weight:700;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
.flag{font-size:11px;padding:1px 8px;border-radius:999px;letter-spacing:.04em}
.flag.part{background:var(--gold-soft);color:var(--gold)}
.flag.miss{background:var(--berry-soft);color:var(--berry)}
.script{margin:4px 0 0;font-size:15px}
.heard{margin:6px 0 0;font-size:14px;color:var(--muted);display:flex;gap:6px}
.heard span:first-child{flex:none;font-size:11px;letter-spacing:.08em;padding-top:2px}
.diff{font-size:12.5px;color:var(--gold);margin-top:4px}
.takes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.take{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 10px 4px 8px;font-size:12.5px}
.take svg{width:10px;height:10px;fill:currentColor;flex:none}
.take .tc{font-family:var(--mono);color:var(--muted);font-size:11.5px}
.take.rec{border-color:var(--pine);color:var(--pine)}
.take.adlib{border-style:dashed}
.take.active{background:var(--pine);color:var(--paper);border-color:var(--pine)}
.take.active .tc{color:var(--paper)}
.missing{color:var(--berry);font-size:13.5px;margin-top:6px}
footer{padding-block:30px 40px;color:var(--muted);font-size:13px}
footer code{font-family:var(--mono);font-size:12px;word-break:break-all}
.hide{display:none}
@media (max-width:520px){.cue{grid-template-columns:38px 1fr;gap:4px 10px}.sep{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top wrap">
  <div class="eyebrow">2026 台中聖雅各聖誕音樂劇・配音整理</div>
  <h1>聖誕樹上的大熊娃娃</h1>
  <p class="lede">88 句台詞依劇本順序排列。點任一個 take 就能試聽；實心綠框是建議採用的版本，虛線框是群聲即興。按上方「連續播放」可從任一句開始，依序聽完整齣對白。</p>
  <div class="stats" id="stats"></div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="now">
      <button class="big" id="pp" aria-label="連續播放"><svg viewBox="0 0 16 16" id="ppi"><path d="M3 1.5v13l11-6.5z"/></svg></button>
      <div class="meta">
        <div class="who" id="who">尚未播放</div>
        <div class="what" id="what">點下方任一句，或按左邊從第 1 句連續播放</div>
        <div class="prog" id="prog"><i id="pbar"></i></div>
      </div>
    </div>
    <div class="ctl" id="roles"></div>
    <div class="ctl">
      <button class="btn" id="fIssue">只看有問題的句子</button>
      <button class="btn on" id="fAd">顯示即興 take</button>
    </div>
  </div>
</div>

<main class="wrap" id="list"></main>

<footer class="wrap">
  <p>試聽音檔為壓縮預覽版。正式合成請用專案資料夾中的高音質分段檔 <code>分段台詞/</code>，檔名以錄音序號開頭，例如 <code>001_旁白_T2_建議_C008.mp3</code>；依劇本順序串好的草稿為 <code>聖誕樹上的大熊娃娃_對白順序合成草稿.mp3</code>。逐字稿為語音辨識後依劇本校正人名，音質與表演尚未試聽審核。配音員姓名待確認。</p>
</footer>

const part = LINES.filter(l => l.takes.some(t => t.r && t.st==="部分")).length;
const miss = LINES.filter(l => !l.takes.length).length;
const nt = LINES.reduce((a,l) => a + l.takes.length, 0);
document.getElementById("stats").innerHTML =
  `<span class="ok">已錄到 <b>${got}</b> / 88 句</span><span class="warn">只錄到部分 <b>${part}</b> 句</span><span class="bad">缺錄 <b>${miss}</b> 句</span><span>共 <b>${nt}</b> 個 take・12 個原始檔</span>`;

// role chips
const rbox = document.getElementById("roles");
rbox.innerHTML = `<button class="btn on" data-r="">全部角色</button>` + ROLES.map(r => `<button class="btn" data-r="${r}">${r}</button>`).join("");
rbox.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.role = b.dataset.r || null;
  rbox.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("fIssue").onclick = e => { state.issue = !state.issue; e.currentTarget.classList.toggle("on", state.issue); render(); };
document.getElementById("fAd").onclick = e => { state.adlib = !state.adlib; e.currentTarget.classList.toggle("on", state.adlib); render(); };

const isIssue = l => !l.takes.length || l.takes.some(t => t.st==="部分" || t.st==="待審");
function render(){
  const list = document.getElementById("list"); let html = ""; let act = null;
  const acts = {}; LINES.forEach(l => { acts[l.a] = (acts[l.a]||0)+1; });
  for (const l of LINES){
    if (state.role && l.role !== state.role) continue;
    if (state.issue && !isIssue(l)) continue;
    if (l.a !== act){ if (act !== null) html += `</section>`; act = l.a; html += `<section class="act"><h2>${l.a}<small>${acts[l.a]} 句</small></h2>`; }
    const col = `var(${RC[l.role]})`;
    const rec = l.takes.find(t => t.r) || l.takes[0];
    const flag = !l.takes.length ? `<span class="flag miss">缺錄</span>` : (rec.st==="部分" ? `<span class="flag part">只錄到部分</span>` : "");
    const tk = l.takes.filter(t => state.adlib || t.st!=="即興").map(t =>
      `<button class="take${t.r?" rec":""}${t.st==="即興"?" adlib":""}" data-n="${l.n}" data-t="${t.t}" title="${esc(t.x)}">${PLAY}T${t.t}${t.r?" 建議":""}${t.st==="即興"?" 即興":""}${t.st==="待審"?" 待審":""} <span class="tc">${FILES[t.f]} ${tc(t.s)}</span></button>`).join("");
    html += `<article class="cue" id="c${l.n}" style="--rc:${col}">
      <div class="num">${String(l.n).padStart(3,"0")}</div>
      <div class="body">
        <div class="head"><span class="role" style="color:${col}">${l.role}</span><span class="hint">${esc(l.hint||"")}</span>${flag}</div>
        <p class="script">${esc(l.text)}</p>
        ${rec ? `<p class="heard"><span>實錄</span><span>${esc(rec.x)}</span></p>${rec.no?`<div class="diff">${esc(rec.no)}</div>`:""}` : `<div class="missing">${esc(l.miss||"")}</div>`}
        ${tk ? `<div class="takes">${tk}</div>` : ""}
      </div></article>`;
  }
  if (act !== null) html += `</section>`;
  list.innerHTML = html || `<p style="padding:30px 0;color:var(--muted)">這個篩選條件下沒有台詞。</p>`;
  mark();
}

const au = document.getElementById("au");
function find(n,t){ const l = LINES.find(x => x.n===n); return [l, l.takes.find(x => x.t===t)]; }
function play(n,t,cont){
  const [l,tk] = find(n,t); state.cur = {n,t}; state.cont = !!cont;
  au.src = tk.u; au.play().catch(()=>{});
  document.getElementById("who").textContent = `${String(n).padStart(3,"0")}・${l.a}・${l.role}・T${t}${tk.r?" 建議":""}・${FILES[tk.f]} ${tc(tk.s)}–${tc(tk.e)}`;
  document.getElementById("what").textContent = tk.x;
  mark(); setIcon(true);
  const el = document.getElementById("c"+n); if (el && cont) el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function mark(){
  document.querySelectorAll(".cue.playing").forEach(e => e.classList.remove("playing"));
  document.querySelectorAll(".take.active").forEach(e => e.classList.remove("active"));
  if (!state.cur) return;
  document.getElementById("c"+state.cur.n)?.classList.add("playing");
  document.querySelector(`.take[data-n="${state.cur.n}"][data-t="${state.cur.t}"]`)?.classList.add("active");
}
function setIcon(p){ document.getElementById("ppi").innerHTML = p ? '<path d="M3 2h3.5v12H3zM9.5 2H13v12H9.5z"/>' : '<path d="M3 1.5v13l11-6.5z"/>'; document.getElementById("pp").setAttribute("aria-label", p?"暫停":"連續播放"); }
// next recommended non-duplicate line respecting role filter
function nextLine(n){
  let prev = LINES.find(x => x.n===n); prev = prev && (prev.takes.find(t=>t.r)||prev.takes[0]);
  for (const l of LINES){
    if (l.n <= n || !l.takes.length) continue;
    if (state.role && l.role !== state.role) continue;
    const r = l.takes.find(t => t.r) || l.takes[0];
    if (prev && r.u === prev.u) continue;
    if (prev && r.f===prev.f && r.s===prev.s) continue;
    return [l.n, r.t];
  }
  return null;
}
document.getElementById("list").addEventListener("click", e => {
  const b = e.target.closest(".take"); if (!b) return;
  play(+b.dataset.n, +b.dataset.t, state.cont);
});
document.getElementById("pp").onclick = () => {
  if (!au.paused){ au.pause(); return; }
  if (state.cur && au.src && au.currentTime>0 && !au.ended){ state.cont = true; au.play(); return; }
  const start = state.cur ? state.cur.n - 1 : 0;
  const nx = nextLine(start); if (nx) play(nx[0], nx[1], true);
};
au.addEventListener("pause", () => setIcon(false));
au.addEventListener("play", () => setIcon(true));
au.addEventListener("timeupdate", () => { document.getElementById("pbar").style.width = (au.duration ? au.currentTime/au.duration*100 : 0) + "%"; });
document.getElementById("prog").addEventListener("click", e => { if (!au.duration) return; const r = e.currentTarget.getBoundingClientRect(); au.currentTime = (e.clientX-r.left)/r.width*au.duration; });
au.addEventListener("ended", () => {
  setIcon(false);
  if (state.cont && state.cur){ const nx = nextLine(state.cur.n); if (nx) setTimeout(() => play(nx[0], nx[1], true), 450); else state.cont = false; }
});
document.addEventListener("keydown", e => { if (e.code==="Space" && e.target===document.body){ e.preventDefault(); document.getElementById("pp").click(); } });
render();
</script>
</html>
